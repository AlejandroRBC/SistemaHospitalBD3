{% extends 'base.html' %}
{% block titulo %}Nueva Consulta{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow">
      <div class="card-header card-header-nodo"><h5 class="mb-0"><i class="bi bi-clipboard2-plus"></i> Registrar Consulta — LPZ</h5></div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('nueva_consulta') }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-bold">Paciente <span class="text-danger">*</span></label>
              <select name="id_paciente" class="form-select" required>
                <option value="">— Seleccionar —</option>
                {% for p in pacientes %}
                <option value="{{ p.id_paciente }}">{{ p.apellido }}, {{ p.nombre }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Médico <span class="text-danger">*</span></label>
              <select name="id_doctor" class="form-select" required>
                <option value="">— Seleccionar —</option>
                {% for d in doctores %}
                <option value="{{ d.id_doctor }}">{{ d.apellido }}, {{ d.nombre }} ({{ d.especialidad }})</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Fecha</label>
              <input type="date" name="fecha" class="form-control" value="{{ now().strftime('%Y-%m-%d') if now else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold">Hora</label>
              <input type="time" name="hora" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label fw-bold">Motivo de Consulta</label>
              <textarea name="motivo" class="form-control" rows="2"></textarea>
            </div>
            <div class="col-12">
              <label class="form-label fw-bold">Diagnóstico</label>
              <textarea name="diagnostico" class="form-control" rows="2"></textarea>
            </div>
          </div>
          <div class="mt-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
            <a href="{{ url_for('consultas') }}" class="btn btn-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
